services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-milenio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTA: No se expone el puerto 5432 por seguridad en producción. 
    # Solo el backend dentro de la red de Docker puede acceder.

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    # NOTA: No se expone el puerto 8000 por seguridad en producción.
    # Nginx en el contenedor frontend se encargará de enrutar el tráfico /api/ hacia el backend.

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
